<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account – Foodies</title>
  <meta name="description"
    content="Sign up for Foodies and start ordering delicious meals from the best local restaurants." />
  <link rel="stylesheet" href="/css/styles.css" />
</head>

<body>
  <main class="auth-card" role="main" aria-label="Sign up form">

    <!-- Brand -->
    <div class="brand">
      <div class="brand-icon" aria-hidden="true">🍔</div>
      <span class="brand-name">Foodies</span>
    </div>

    <!-- Heading -->
    <h1 class="card-title">Create account</h1>

    <!-- Signup Form -->
    <form id="signup-form" novalidate>

      <!-- Email Field -->
      <div class="form-group">
        <label class="form-label" for="signup-email">Email address</label>
        <div class="input-wrapper">
          <input class="form-input" type="email" id="signup-email" name="email" placeholder="you@example.com"
            autocomplete="email" aria-describedby="signup-email-error" aria-required="true" />
        </div>
        <!-- UA-FR-07: Inline error placement -->
        <span class="field-error" id="signup-email-error" role="alert" aria-live="polite"></span>
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <label class="form-label" for="signup-password">Password</label>
        <div class="input-wrapper">
          <input class="form-input" type="password" id="signup-password" name="password"
            placeholder="Min 8 chars · 1 cap · 1 lower · 1 special · 1 number" autocomplete="new-password"
            aria-describedby="signup-password-error" aria-required="true" />
          <button type="button" class="toggle-password" id="toggle-signup-password"
            aria-label="Toggle password visibility" tabindex="-1">
            <!-- Eye icon -->
            <svg id="eye-open" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24"
              stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            <svg id="eye-closed" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none"
              viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="display:none">
              <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94" />
              <path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19" />
              <line x1="1" y1="1" x2="23" y2="23" />
            </svg>
          </button>
        </div>
        <!-- UA-FR-07: Inline error placement -->
        <span class="field-error" id="signup-password-error" role="alert" aria-live="polite"></span>

        <!-- UA-FR-02: Password constraint hints -->
        <div class="password-hints" id="password-hints" aria-label="Password requirements">
          <div class="hint-item" id="hint-length" aria-label="8 to 64 characters">
            <span class="hint-dot"></span>8–64 characters
          </div>
          <div class="hint-item" id="hint-upper" aria-label="One uppercase letter">
            <span class="hint-dot"></span>1 uppercase letter
          </div>
          <div class="hint-item" id="hint-lower" aria-label="One lowercase letter">
            <span class="hint-dot"></span>1 lowercase letter
          </div>
          <div class="hint-item" id="hint-special" aria-label="One special character">
            <span class="hint-dot"></span>1 special character
          </div>
          <div class="hint-item" id="hint-number" aria-label="One number">
            <span class="hint-dot"></span>1 number
          </div>
        </div>
      </div>

      <!-- Submit -->
      <button class="btn-primary" type="submit" id="signup-btn">Sign up</button>

    </form>

    <!-- Footer -->
    <p class="auth-footer">
      Already registered? <a href="/login.html" id="go-to-login">Log in</a>
    </p>

  </main>

  <script src="/js/signup.js"></script>
</body>

</html>
