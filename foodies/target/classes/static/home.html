<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home – Foodies</title>
  <meta name="description" content="Foodies – Order delicious meals from the best local restaurants." />
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/home.css" />
</head>
<body class="home-body">

  <!-- ═══ Sidebar ═══════════════════════════════════════════════════════════ -->
  <aside class="home-sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon" aria-hidden="true">🍔</div>
      <span class="brand-name">Foodies</span>
    </div>

    <span class="sidebar-section-label">Menu</span>
    <nav class="sidebar-nav">
      <a href="/home.html" class="sidebar-link active" id="nav-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none"
          viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1"/>
        </svg>
        Restaurants
      </a>
      <a href="/saved-addresses.html" class="sidebar-link" id="nav-addresses">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none"
          viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M17.657 16.657L13.414 20.9a2 2 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
          <circle cx="12" cy="11" r="3"/>
        </svg>
        Saved Addresses
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="home-user-info">
        <div class="avatar" id="user-avatar">U</div>
        <span class="user-email" id="user-email-display">user@foodies.com</span>
      </div>
      <a href="#" class="sidebar-logout" id="logout-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none"
          viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a2 2 0 01-2 2H6a2 2 0 01-2-2V7a2 2 0 012-2h5a2 2 0 012 2v1"/>
        </svg>
        Log out
      </a>
    </div>
  </aside>

  <!-- ═══ Main Content ══════════════════════════════════════════════════════ -->
  <main class="home-main">

    <!-- Top Bar -->
    <div class="home-topbar">
      <div class="topbar-left">
        <h1 class="home-page-title" id="page-title">Restaurants</h1>
        <p class="home-page-subtitle">Browse and order from the best restaurants near you</p>
      </div>
    </div>

    <!-- Search & Sort Controls -->
    <div class="search-controls">
      <div class="search-box">
        <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none"
          viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" class="search-input" id="search-input"
          placeholder="Search restaurants..." autocomplete="off" />
      </div>
      <div class="sort-wrapper">
        <label class="sort-label" for="sort-select">Sort by</label>
        <select class="sort-select" id="sort-select">
          <option value="name">Name (A-Z)</option>
          <option value="rating">Rating</option>
          <option value="delivery_time">Delivery Time</option>
          <option value="delivery_price">Delivery Price</option>
        </select>
      </div>
    </div>

    <!-- Restaurant count -->
    <div class="results-info">
      <span class="results-count" id="results-count">0 restaurants</span>
    </div>

    <!-- Restaurant Cards Grid -->
    <div class="restaurants-grid" id="restaurants-grid">
      <!-- Populated by home.js -->
    </div>

    <!-- Empty State -->
    <div class="home-empty-state" id="empty-state" style="display:none">
      <div class="empty-icon" aria-hidden="true">🍽️</div>
      <p class="empty-title">No restaurants found</p>
      <p class="empty-sub">Try adjusting your search query.</p>
    </div>

    <!-- Loading State -->
    <div class="loading-state" id="loading-state">
      <div class="loading-spinner"></div>
      <p>Loading restaurants...</p>
    </div>

  </main>

  <script src="/js/home.js"></script>
</body>
</html>
