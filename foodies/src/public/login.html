<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In – Foodies</title>
  <meta name="description"
    content="Log in to your Foodies account to order delicious meals from the best local restaurants." />
  <link rel="stylesheet" href="/css/styles.css" />
</head>

<body>
  <main class="auth-card" role="main" aria-label="Login form">

    <!-- Brand -->
    <div class="brand">
      <div class="brand-icon" aria-hidden="true">🍔</div>
      <span class="brand-name">Foodies</span>
    </div>

    <!-- Heading -->
    <h1 class="card-title">Welcome back</h1>

    <!-- Login Form -->
    <form id="login-form" novalidate>

      <!-- Email Field -->
      <div class="form-group">
        <label class="form-label" for="login-email">Email address</label>
        <div class="input-wrapper">
          <input class="form-input" type="email" id="login-email" name="email" placeholder="you@example.com"
            autocomplete="email" aria-required="true" />
        </div>
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <label class="form-label" for="login-password">Password</label>
        <div class="input-wrapper">
          <input class="form-input" type="password" id="login-password" name="password" placeholder="••••••••"
            autocomplete="current-password" aria-required="true" />
          <button type="button" class="toggle-password" id="toggle-login-password"
            aria-label="Toggle password visibility" tabindex="-1">
            <svg id="login-eye-open" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none"
              viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            <svg id="login-eye-closed" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none"
              viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="display:none">
              <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94" />
              <path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19" />
              <line x1="1" y1="1" x2="23" y2="23" />
            </svg>
          </button>
        </div>
      </div>

      <!-- LG-FR-05: Errors appear ONLY after submit, not real-time -->
      <!-- LG-FR-02/03/04: Generic error message box -->
      <div class="form-error-box" id="login-error-box" role="alert" aria-live="assertive">
        Check email and password again
      </div>

      <!-- Submit -->
      <button class="btn-primary" type="submit" id="login-btn">Log in</button>

    </form>

    <!-- Footer -->
    <p class="auth-footer">
      New here? <a href="/signup.html" id="go-to-signup">Sign up</a>
    </p>

  </main>

  <script src="/js/login.js"></script>
</body>

</html>
