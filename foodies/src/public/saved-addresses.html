<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saved Addresses – Foodies</title>
  <meta name="description" content="Manage your delivery addresses on Foodies." />
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/saved-addresses.css" />
</head>
<body class="addresses-body">

  <!-- ═══ Sidebar ═══════════════════════════════════════════════════════════ -->
  <aside class="addr-sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon" aria-hidden="true">🍔</div>
      <span class="brand-name">Foodies</span>
    </div>

    <span class="sidebar-section-label">Menu</span>
    <nav class="sidebar-nav">
      <a href="/home.html" class="sidebar-link" id="nav-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none"
          viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1"/>
        </svg>
        Restaurants
      </a>
      <a href="/saved-addresses.html" class="sidebar-link active" id="nav-addresses">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none"
          viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M17.657 16.657L13.414 20.9a2 2 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
          <circle cx="12" cy="11" r="3"/>
        </svg>
        Saved Addresses
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="addr-user-info">
        <div class="avatar" id="user-avatar">U</div>
        <span class="user-email" id="user-email-display">user@foodies.com</span>
      </div>
      <a href="#" class="sidebar-logout" id="logout-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none"
          viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a2 2 0 01-2 2H6a2 2 0 01-2-2V7a2 2 0 012-2h5a2 2 0 012 2v1"/>
        </svg>
        Log out
      </a>
    </div>
  </aside>

  <!-- ═══ Main Content ══════════════════════════════════════════════════════ -->
  <main class="addr-main">

    <!-- Top Bar -->
    <div class="addr-topbar">
      <div class="topbar-left">
        <h1 class="addr-page-title">Saved Addresses</h1>
        <p class="addr-page-subtitle">Manage your delivery addresses</p>
      </div>
      <button class="btn-primary add-btn" id="add-address-btn" type="button">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none"
          viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
          <line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" />
        </svg>
        Add Address
      </button>
    </div>

    <!-- Addresses Grid -->
    <div class="addresses-grid" id="addresses-container">
      <!-- Populated by saved-addresses.js -->
    </div>

  </main>

  <!-- ═══ Modal: Add / Edit Address ═══════════════════════════════════════════ -->
  <div class="modal-overlay" id="address-modal" role="dialog" aria-modal="true"
    aria-labelledby="modal-title" hidden>
    <div class="modal-card" role="document">

      <div class="modal-header">
        <h2 class="modal-title" id="modal-title">Add New Address</h2>
        <button class="modal-close" id="close-modal" type="button" aria-label="Close modal">&times;</button>
      </div>

      <!-- General error box -->
      <div class="modal-error-box" id="form-error" role="alert" aria-live="assertive"></div>

      <form id="address-form" novalidate>
        <input type="hidden" id="address-id" />

        <div class="form-row">
          <!-- Phone -->
          <div class="form-group">
            <label class="form-label" for="phone">Phone Number (11 digits) *</label>
            <input class="form-input" type="text" id="phone" name="phone"
              placeholder="01234567890" pattern="\d{11}" autocomplete="off"
              aria-required="true" />
          </div>
        </div>

        <div class="form-row">
          <!-- Building -->
          <div class="form-group">
            <label class="form-label" for="building">Building *</label>
            <input class="form-input" type="text" id="building" name="building"
              placeholder="Bldg #" autocomplete="off" aria-required="true" />
          </div>

          <!-- Apartment -->
          <div class="form-group">
            <label class="form-label" for="apartment">Apartment</label>
            <input class="form-input" type="text" id="apartment" name="apartment"
              placeholder="Apt #" autocomplete="off" />
          </div>
        </div>

        <div class="form-row">
          <!-- Floor -->
          <div class="form-group">
            <label class="form-label" for="floor">Floor</label>
            <input class="form-input" type="text" id="floor" name="floor"
              placeholder="Floor #" autocomplete="off" />
          </div>

          <!-- Street -->
          <div class="form-group">
            <label class="form-label" for="street">Street *</label>
            <input class="form-input" type="text" id="street" name="street"
              placeholder="Main St" autocomplete="off" aria-required="true" />
          </div>
        </div>

        <div class="form-row">
          <!-- Landmark -->
          <div class="form-group">
            <label class="form-label" for="landmark">Nearby Landmark</label>
            <input class="form-input" type="text" id="landmark" name="landmark"
              placeholder="Near the park" autocomplete="off" />
          </div>
        </div>


        <!-- Actions -->
        <div class="modal-actions">
          <button class="btn-secondary" type="button" id="cancel-modal">Cancel</button>
          <button class="btn-primary save-btn" type="submit" id="save-address-btn">Save Address</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/saved-addresses.js"></script>
</body>
</html>
